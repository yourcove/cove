name: Publish Cove Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (semver). If omitted on tag runs, uses the tag without leading v.'
        required: false

permissions:
  contents: read
  packages: write
  # Lets the job ask GitHub for the OIDC token that NuGet.org exchanges for a short-lived API key.
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "No version provided" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using package version ${VERSION}"

      - name: Restore
        run: dotnet restore src/Cove.slnx

      - name: Pack Cove.Core
        run: >
          dotnet pack src/Cove.Core/Cove.Core.csproj
          -c Release
          --no-restore
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o artifacts/nuget

      - name: Pack Cove.Plugins
        run: >
          dotnet pack src/Cove.Plugins/Cove.Plugins.csproj
          -c Release
          --no-restore
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o artifacts/nuget

      - name: Pack Cove.Sdk
        run: >
          dotnet pack src/Cove.Sdk/Cove.Sdk.csproj
          -c Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o artifacts/nuget

      # NuGet.org trusted publishing: no stored API key. A policy on the NuGet.org account that owns
      # the Cove.* packages names this repository and this workflow file (publish-plugins-package.yml),
      # and NuGet.org issues a key that is valid for one hour and can only come from a run of it.
      # Renaming this file, or moving the push into another workflow, needs the policy updated to match.
      # NUGET_USER is a repository variable holding that account's NuGet.org profile name.
      - name: Check NuGet.org user is configured
        if: ${{ vars.NUGET_USER == '' }}
        run: |
          echo "::error::Repository variable NUGET_USER is not set. Set it to the NuGet.org profile name that owns the trusted publishing policy."
          exit 1

      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
