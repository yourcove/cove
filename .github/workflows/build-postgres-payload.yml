name: Build PostgreSQL Payload

# Repacks PostgreSQL into release assets on this repository, which Cove downloads on first run.
# Upstream (EDB, PGDG) deletes superseded builds, so pointing users at them directly broke every
# fresh install once a pinned version disappeared. See docs/contributing/postgres-payload.md.

on:
  workflow_dispatch:
    inputs:
      postgres_major:
        description: PostgreSQL major version
        required: true
        default: '18'
      postgres_version:
        description: PostgreSQL full version (must exist as an EDB and a PGDG build)
        required: true
        default: '18.3'
      windows_url:
        description: EDB Windows x64 binaries zip
        required: true
        default: https://sbp.enterprisedb.com/getfile.jsp?fileid=1260146
      macos_url:
        description: EDB macOS binaries zip
        required: true
        default: https://sbp.enterprisedb.com/getfile.jsp?fileid=1260163
      release_tag:
        description: Optional payload release tag override
        required: false
        default: ''

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-26.04
    outputs:
      postgres_major: ${{ steps.values.outputs.postgres_major }}
      postgres_version: ${{ steps.values.outputs.postgres_version }}
      release_tag: ${{ steps.values.outputs.release_tag }}
    steps:
      - id: values
        shell: bash
        run: |
          POSTGRES_MAJOR='${{ inputs.postgres_major }}'
          POSTGRES_VERSION='${{ inputs.postgres_version }}'
          RELEASE_TAG='${{ inputs.release_tag }}'

          case "$POSTGRES_VERSION" in
            "$POSTGRES_MAJOR".*) ;;
            *) echo "postgres_version $POSTGRES_VERSION is not a $POSTGRES_MAJOR.x release" >&2; exit 1 ;;
          esac
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="postgres-payload-v${POSTGRES_VERSION}"
          fi

          echo "postgres_major=$POSTGRES_MAJOR" >> "$GITHUB_OUTPUT"
          echo "postgres_version=$POSTGRES_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-edb:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            url: ${{ inputs.windows_url }}
          - os: macos-26
            rid: osx-arm64
            url: ${{ inputs.macos_url }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Repack EDB binaries
        shell: pwsh
        run: >
          ./scripts/postgres-payload/repack-edb-zip.ps1
          -Url '${{ matrix.url }}'
          -PgVersion '${{ needs.metadata.outputs.postgres_version }}'
          -Rid '${{ matrix.rid }}'
          -OutputDir payload

      - uses: actions/upload-artifact@v7
        with:
          name: postgres-payload-${{ matrix.rid }}
          path: payload/*
          retention-days: 7

  build-linux:
    needs: metadata
    runs-on: ubuntu-26.04
    # The oldest glibc the payload runs on: Ubuntu 22.04 (glibc 2.35) also covers Debian 12 and later.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7

      - name: Repack PGDG packages
        shell: bash
        run: >
          bash scripts/postgres-payload/repack-linux.sh
          '${{ needs.metadata.outputs.postgres_major }}'
          '${{ needs.metadata.outputs.postgres_version }}'
          linux-x64
          payload

      - uses: actions/upload-artifact@v7
        with:
          name: postgres-payload-linux-x64
          path: payload/*
          retention-days: 7

  publish:
    needs: [metadata, build-edb, build-linux]
    runs-on: ubuntu-26.04
    env:
      POSTGRES_MAJOR: ${{ needs.metadata.outputs.postgres_major }}
      POSTGRES_VERSION: ${{ needs.metadata.outputs.postgres_version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: payload-artifacts

      - name: Generate payload manifest
        shell: pwsh
        run: |
          $assets = [ordered]@{}
          $prefix = "postgres-$env:POSTGRES_VERSION-"
          $suffix = ".tar.gz"

          Get-ChildItem -Path payload-artifacts -Recurse -File -Filter '*.tar.gz' | Sort-Object Name | ForEach-Object {
            if (-not $_.Name.StartsWith($prefix) -or -not $_.Name.EndsWith($suffix)) {
              throw "Unexpected payload archive name '$($_.Name)'. Expected ${prefix}<rid>${suffix}."
            }

            $rid = $_.Name.Substring($prefix.Length, $_.Name.Length - $prefix.Length - $suffix.Length)
            $shaPath = "$($_.FullName).sha256"
            if (-not (Test-Path $shaPath)) {
              throw "Missing checksum file $shaPath"
            }

            $sha256 = ((Get-Content -Path $shaPath -Raw) -split '\s+')[0].Trim().ToLowerInvariant()
            $assets[$rid] = [ordered]@{
              fileName = $_.Name
              url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$($_.Name)"
              sha256 = $sha256
              sizeBytes = $_.Length
            }
          }

          foreach ($requiredRid in @('win-x64', 'linux-x64', 'osx-arm64')) {
            if (-not $assets.Contains($requiredRid)) {
              throw "The payload manifest is missing required RID '$requiredRid'."
            }
          }

          $manifest = [ordered]@{
            schema = 1
            postgresMajor = $env:POSTGRES_MAJOR
            postgresVersion = $env:POSTGRES_VERSION
            releaseTag = $env:RELEASE_TAG
            assets = $assets
          }

          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path release-files/postgres-payload-manifest.json -Encoding UTF8
          Get-ChildItem -Path payload-artifacts -Recurse -File |
            Where-Object { $_.Name -like '*.tar.gz' -or $_.Name -like '*.sha256' } |
            Copy-Item -Destination release-files

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: PostgreSQL ${{ needs.metadata.outputs.postgres_version }} payload
          body: |
            Portable PostgreSQL ${{ needs.metadata.outputs.postgres_version }} binaries that Cove's managed
            PostgreSQL downloads on first run (bin/, lib/ and share/ only). Repacked from the EDB
            Windows and macOS binaries and from the PGDG packages for Ubuntu 22.04, with the shared
            libraries they need bundled so the Linux payload runs on any distribution with glibc 2.35
            or newer.

            The manifest asset contains the URL and SHA-256 for each runtime identifier.
          files: release-files/*
          make_latest: false
