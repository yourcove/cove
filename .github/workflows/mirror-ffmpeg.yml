name: Mirror FFmpeg Builds

# Mirrors BtbN's latest FFmpeg builds into this repository's own releases so container image builds
# have a stable, always-available source. BtbN uses versioned asset names and does not retain old
# builds. The Dockerfiles try this mirror first (via the FFMPEG_MIRROR_BASE build arg that release.yml
# passes) and fall back to BtbN's latest release API if the mirror is unavailable.
#
# Downloads go through the `gh` CLI (authenticated) rather than raw `curl` to the release download
# URLs, which 404 intermittently from GitHub Actions runners.
#
# Run this manually after first setting up the repo, and let the monthly schedule keep it current.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish the mirrored FFmpeg assets under
        required: false
        default: 'ffmpeg-payload'
  schedule:
    # Refresh on the 1st of each month so the mirror tracks reasonably current FFmpeg builds.
    - cron: '0 6 1 * *'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'ffmpeg-payload' }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify FFmpeg builds from BtbN
        env:
          # gh needs a token to read BtbN/FFmpeg-Builds via the API; the default workflow token works
          # for public repos and is far more reliable than anonymous raw release downloads.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror && cd mirror

          # Variants consumed by the Dockerfiles:
          #   *-gpl.tar.xz        -> docker/Dockerfile.app (static binaries)
          #   *-gpl-shared.tar.xz -> docker/Dockerfile      (shared libs for in-process frame extraction)
          # Resolve exact asset names from the release API. Do not rely on gh wildcard matching here:
          # BtbN alternates between stable ffmpeg-master-latest-* names and versioned ffmpeg-N-* names.
          gh api repos/BtbN/FFmpeg-Builds/releases/latest > release.json
          python3 <<'PY' > resolved-assets.env
          import json
          import re
          import shlex
          import sys

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          tag = release.get("tag_name") or ""
          release_assets = release.get("assets", [])
          assets = [asset.get("name", "") for asset in release_assets]
          digests = {
              asset.get("name", ""): asset.get("digest", "").removeprefix("sha256:")
              for asset in release_assets
          }

          def resolve(platform, variant):
              stable = f"ffmpeg-master-latest-{platform}-{variant}.tar.xz"
              if stable in assets:
                  return stable

              pattern = re.compile(rf"^ffmpeg-N-.*-{re.escape(platform)}-{re.escape(variant)}\.tar\.xz$")
              matches = [asset for asset in assets if pattern.match(asset)]
              if len(matches) != 1:
                  print(f"Expected exactly one BtbN asset for {platform}/{variant}, got:", file=sys.stderr)
                  for match in matches:
                      print(f"  {match}", file=sys.stderr)
                  print("Available assets:", file=sys.stderr)
                  for asset in assets:
                      print(f"  {asset}", file=sys.stderr)
                  sys.exit(1)
              return matches[0]

          resolved = {
              "tag": tag,
              "linux64_gpl": resolve("linux64", "gpl"),
              "linuxarm64_gpl": resolve("linuxarm64", "gpl"),
              "linux64_gpl_shared": resolve("linux64", "gpl-shared"),
              "linuxarm64_gpl_shared": resolve("linuxarm64", "gpl-shared"),
          }
          resolved.update({f"{key}_sha": digests.get(value, "") for key, value in list(resolved.items()) if key != "tag"})

          if not tag:
              print("Unable to resolve BtbN latest release tag", file=sys.stderr)
              sys.exit(1)

          required = {value for key, value in resolved.items() if key != "tag" and not key.endswith("_sha")}
          missing = sorted(required.difference(assets))
          if missing:
              print("Missing required BtbN assets:", file=sys.stderr)
              for asset in missing:
                  print(f"  {asset}", file=sys.stderr)
              sys.exit(1)

          missing_digest = sorted(key for key, value in resolved.items() if key.endswith("_sha") and not value)
          if missing_digest:
              print("Missing GitHub release digests:", file=sys.stderr)
              for key in missing_digest:
                  print(f"  {key}", file=sys.stderr)
              sys.exit(1)

          for key, value in resolved.items():
              print(f"{key}={shlex.quote(value)}")
          PY
          source resolved-assets.env

          assets=("${linux64_gpl}" "${linuxarm64_gpl}" "${linux64_gpl_shared}" "${linuxarm64_gpl_shared}")
          if [ "$(printf '%s\n' "${assets[@]}" | sort -u | wc -l)" -ne 4 ]; then
            echo "Resolved duplicate FFmpeg assets in BtbN latest release ${tag}:"
            printf '  %s\n' "${assets[@]}"
            exit 1
          fi

          echo "Resolved BtbN latest release ${tag}:"
          printf '  %s\n' "${assets[@]}"

          for asset in "${assets[@]}"; do
            echo "Downloading ${asset}"
            gh release download "${tag}" --repo BtbN/FFmpeg-Builds --clobber --pattern "${asset}"
          done

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual
            actual=$(sha256sum "${file}" | cut -d ' ' -f 1)
            if [ "${actual}" != "${expected}" ]; then
              echo "Checksum mismatch for ${file}"
              echo "  expected: ${expected}"
              echo "  actual:   ${actual}"
              exit 1
            fi
          }

          echo "Verifying checksums"
          verify_sha256 "${linux64_gpl}" "${linux64_gpl_sha}"
          verify_sha256 "${linuxarm64_gpl}" "${linuxarm64_gpl_sha}"
          verify_sha256 "${linux64_gpl_shared}" "${linux64_gpl_shared_sha}"
          verify_sha256 "${linuxarm64_gpl_shared}" "${linuxarm64_gpl_shared_sha}"

          [ "${linux64_gpl}" = ffmpeg-master-latest-linux64-gpl.tar.xz ] || mv "${linux64_gpl}" ffmpeg-master-latest-linux64-gpl.tar.xz
          [ "${linuxarm64_gpl}" = ffmpeg-master-latest-linuxarm64-gpl.tar.xz ] || mv "${linuxarm64_gpl}" ffmpeg-master-latest-linuxarm64-gpl.tar.xz
          [ "${linux64_gpl_shared}" = ffmpeg-master-latest-linux64-gpl-shared.tar.xz ] || mv "${linux64_gpl_shared}" ffmpeg-master-latest-linux64-gpl-shared.tar.xz
          [ "${linuxarm64_gpl_shared}" = ffmpeg-master-latest-linuxarm64-gpl-shared.tar.xz ] || mv "${linuxarm64_gpl_shared}" ffmpeg-master-latest-linuxarm64-gpl-shared.tar.xz
          sha256sum ffmpeg-master-latest-*.tar.xz > checksums.sha256

      - name: Publish mirror release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FFmpeg payload mirror
          body: |
            Mirror of BtbN FFmpeg-Builds latest release (GPL static + GPL shared, linux64 + linuxarm64),
            re-hosted here so container image builds have a stable, always-available source.
            Refreshed by the "Mirror FFmpeg Builds" workflow. Checksums verified against BtbN.
          files: |
            mirror/ffmpeg-master-latest-linux64-gpl.tar.xz
            mirror/ffmpeg-master-latest-linuxarm64-gpl.tar.xz
            mirror/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
            mirror/ffmpeg-master-latest-linuxarm64-gpl-shared.tar.xz
            mirror/checksums.sha256
