name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build frontend once, share via artifact ─────────────────────
  build-ui:
    needs: check-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install & build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/
          retention-days: 1

  # ── Build self-contained executables per platform ───────────────
  build-native:
    needs: [build-ui, check-version]
    strategy:
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            artifact: cove-win-x64
            ext: .zip
          - os: ubuntu-26.04
            rid: linux-x64
            artifact: cove-linux-x64
            ext: .tar.gz
          - os: macos-26
            rid: osx-arm64
            artifact: cove-osx-arm64
            ext: .tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained app
        run: >
          dotnet publish src/Cove.Api/Cove.Api.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:PgvectorPayloadRepository=${{ github.repository }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ env.VERSION }}
          -p:CoveCiVersion=true
          -p:CoveDistribution=native-${{ matrix.rid }}
          -p:CoveReleaseChannel=${{ needs.check-version.outputs.is_stable == 'true' && 'stable' || 'prerelease' }}
          -o publish/

      - name: Publish native instance manager
        run: >
          dotnet publish src/Cove.InstanceManager/Cove.InstanceManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ env.VERSION }}
          -p:CoveCiVersion=true
          -o publish/

      - uses: actions/setup-node@v7
        if: runner.os == 'macOS'
        with:
          node-version: '22'

      - name: Verify macOS managed PostgreSQL first run and restart
        if: runner.os == 'macOS'
        timeout-minutes: 35
        run: node scripts/smoke-macos-postgres.mjs publish/Cove

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $files = @("Cove.exe", "Cove.InstanceManager.exe")
          foreach ($file in $files) {
            $source = Join-Path "publish" $file
            if (-not (Test-Path $source)) { throw "Missing native executable: $source" }
            Copy-Item -Path $source -Destination $packageDir -Force
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath ${{ matrix.artifact }}${{ matrix.ext }}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("${{ matrix.artifact }}${{ matrix.ext }}")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName } | Sort-Object
          }
          finally {
            $zip.Dispose()
          }
          $expected = $files | Sort-Object
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $entries
          if ($diff) { throw "Unexpected archive contents: $($entries -join ', ')" }

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          for file in Cove Cove.InstanceManager; do
            test -f "publish/$file" || { echo "Missing native executable: publish/$file" >&2; exit 1; }
            cp "publish/$file" package/
          done
          tar -czf ${{ matrix.artifact }}${{ matrix.ext }} -C package Cove Cove.InstanceManager
          entries="$(tar -tzf ${{ matrix.artifact }}${{ matrix.ext }} | sort)"
          expected="$(printf 'Cove\nCove.InstanceManager')"
          if [ "$entries" != "$expected" ]; then
            echo "Unexpected archive contents:" >&2
            printf '%s\n' "$entries" >&2
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: sha256sum ${{ matrix.artifact }}${{ matrix.ext }} > ${{ matrix.artifact }}${{ matrix.ext }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256
          retention-days: 1

  # ── Verify and build standalone CLI executables ─────────────────
  verify-cli:
    needs: check-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Verify CLI
        working-directory: cli
        run: |
          bun run typecheck
          bun test
          bun build src/index.ts --compile --target=bun-linux-x64-baseline --outfile=dist/cove-cli
          bun run test:compiled

  build-cli:
    needs: [check-version, verify-cli]
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - target: bun-linux-x64-baseline
            artifact: cove-cli-linux-x64
            executable: cove-cli
            archive: cove-cli-linux-x64.tar.gz
          - target: bun-linux-arm64
            artifact: cove-cli-linux-arm64
            executable: cove-cli
            archive: cove-cli-linux-arm64.tar.gz
          - target: bun-darwin-x64-baseline
            artifact: cove-cli-macos-x64
            executable: cove-cli
            archive: cove-cli-macos-x64.tar.gz
          - target: bun-darwin-arm64
            artifact: cove-cli-macos-arm64
            executable: cove-cli
            archive: cove-cli-macos-arm64.tar.gz
          - target: bun-windows-x64-baseline
            artifact: cove-cli-windows-x64
            executable: cove-cli.exe
            archive: cove-cli-windows-x64.zip
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Build executable
        working-directory: cli
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.executable }}

      - name: Package executable
        working-directory: cli/dist
        run: |
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            zip "${{ matrix.archive }}" "${{ matrix.executable }}"
          else
            tar -czf "${{ matrix.archive }}" "${{ matrix.executable }}"
          fi
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            cli/dist/${{ matrix.archive }}
            cli/dist/${{ matrix.archive }}.sha256
          retention-days: 1

  # ── Determine release type ────────────────────────────────────────
  check-version:
    runs-on: ubuntu-26.04
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      is_latest: ${{ steps.check.outputs.is_latest }}
      is_maintenance: ${{ steps.check.outputs.is_maintenance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release version and lineage
        id: check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_STABLE=false
          IS_LATEST=false
          IS_MAINTENANCE=false

          # Stable = vN.N.N (no alpha/beta/rc/dev suffix)
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            IS_STABLE=true
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            RELEASE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"

            git fetch origin "$DEFAULT_BRANCH" --no-tags
            MAIN_HEAD="$(git rev-parse FETCH_HEAD)"
            if git merge-base --is-ancestor "$RELEASE_COMMIT" "$MAIN_HEAD"; then
              HIGHEST_STABLE_TAG="$(
                git tag --list 'v*' \
                  | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                  | sort -V \
                  | tail -n 1
              )"
              if [[ "$TAG" == "$HIGHEST_STABLE_TAG" ]]; then
                IS_LATEST=true
              fi
              echo "Stable release is in $DEFAULT_BRANCH history."
            else
              RELEASE_BRANCH="release/${MAJOR}.${MINOR}"
              if ! git fetch origin "$RELEASE_BRANCH" --no-tags; then
                echo "Stable release is not in $DEFAULT_BRANCH history and $RELEASE_BRANCH does not exist." >&2
                exit 1
              fi
              RELEASE_BRANCH_HEAD="$(git rev-parse FETCH_HEAD)"
              if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$RELEASE_BRANCH_HEAD"; then
                echo "Stable $TAG must be in $DEFAULT_BRANCH or $RELEASE_BRANCH history." >&2
                exit 1
              fi
              IS_MAINTENANCE=true
              echo "Stable maintenance release is in $RELEASE_BRANCH history."
            fi
          elif [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]] \
            && [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev(\.|$) ]]; then
            prerelease="${TAG#*-}"
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not contain leading zeroes: $TAG" >&2
                exit 1
              fi
            done
          else
            echo "Release tags must be vMAJOR.MINOR.PATCH or a SemVer prerelease such as v1.2.0-rc.1." >&2
            echo "The -dev.N form is reserved for builds derived from main." >&2
            exit 1
          fi

          {
            echo "is_stable=$IS_STABLE"
            echo "is_latest=$IS_LATEST"
            echo "is_maintenance=$IS_MAINTENANCE"
          } >> "$GITHUB_OUTPUT"

  # ── Build Docker images for stable and prerelease tags ───────────
  # Each platform builds natively on its own runner and pushes an untagged image by digest;
  # merge-docker then tags the multi-platform image. Building arm64 under QEMU on an x64 runner was
  # about 10x slower and intermittently hung until the job timeout.
  build-docker:
    needs: [build-ui, check-version]
    runs-on: ${{ matrix.runner }}
    # A healthy build takes a few minutes. Fail a hung build here instead of at the 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [all-in-one, app]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: all-in-one
            dockerfile: docker/Dockerfile
            suffix: ""
          - image: app
            dockerfile: docker/Dockerfile.app
            suffix: "-app"
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Registry names must be lowercase, and a fork's owner may not be.
      - name: Image name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}${SUFFIX}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          # One scope per image and platform, so the four builds don't overwrite each other's cache.
          cache-from: type=gha,scope=docker-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.image }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            FFMPEG_MIRROR_BASE=https://github.com/${{ github.repository }}/releases/download/ffmpeg-payload

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: docker-digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    needs: [check-version, build-docker]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: all-in-one
            suffix: ""
          - image: app
            suffix: "-app"

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}${SUFFIX}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check-version.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.check-version.outputs.is_latest == 'true' }}

      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # One digest per platform; anything else means a build is missing.
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the image
        run: |
          set -euo pipefail
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          platforms="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')"
          echo "Platforms: $platforms"
          test "$platforms" = "linux/amd64,linux/arm64"

  # ── Create GitHub Release ───────────────────────────────────────
  release:
    needs: [build-native, build-cli, merge-docker, check-version]
    # Publish the release only after all native packages and container images succeed.
    if: >-
      always()
      && needs.build-native.result == 'success'
      && needs.build-cli.result == 'success'
      && needs.merge-docker.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts/ -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' | while read f; do
            cp "$f" release-files/
          done
          # The archives hold only the two executables, which is all the built-in updater accepts, so the
          # licence texts and notices for the bundled libraries (libvips among them) are separate assets.
          cp THIRD-PARTY-NOTICES.md release-files/
          cp licenses/LGPL-3.0.txt release-files/LICENSE-LGPL-3.0.txt
          cp licenses/GPL-3.0.txt release-files/LICENSE-GPL-3.0.txt

      - name: Extract release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo 'CHANGELOG<<EOF'
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate combined checksums
        working-directory: release-files
        run: |
          sha256sum *.zip *.tar.gz 2>/dev/null > checksums.txt || true

      # The manifest Cove's built-in updater reads (releases/latest/download/cove-release.json).
      - name: Generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANNEL: ${{ needs.check-version.outputs.is_stable == 'true' && 'stable' || 'prerelease' }}
        run: >-
          node scripts/generate-release-manifest.mjs
          --version "$VERSION"
          --channel "$CHANNEL"
          --assets-dir release-files
          --migrations-dir src/Cove.Data/Migrations
          --changelog CHANGELOG.md
          --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          --output release-files/cove-release.json

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.check-version.outputs.is_stable != 'true' }}
          make_latest: ${{ needs.check-version.outputs.is_latest == 'true' }}
          files: release-files/*
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Downloads

            Standalone executables for Windows, Linux, and macOS are attached below.

            ${{ needs.check-version.outputs.is_stable != 'true' && '> **Pre-release:** These container tags are isolated and do not update the stable or nightly aliases.' || '' }}
            ${{ needs.check-version.outputs.is_maintenance == 'true' && '> **Maintenance release:** This release updates its major/minor container alias but does not replace the current `latest` release or container alias.' || '' }}

            ## Docker Images

            **All-in-one** (includes PostgreSQL + FFmpeg):
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ```

            **App only** (requires external PostgreSQL):
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ steps.version.outputs.VERSION }}
            ```

            See [Docker setup docs](docker/README.md) for docker-compose examples.

  # ── CI checks (runs on all pushes and PRs too) ──────────────────
  ci:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    # PostgreSQL-backed tests ([RequiresPostgres]) each get a copy of a database migrated once per run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVE_API_TEST_PG_HOST: 127.0.0.1
      COVE_API_TEST_PG_PORT: 5432
      COVE_API_TEST_PG_USER: postgres
      COVE_API_TEST_PG_PASSWORD: postgres
      COVE_API_TEST_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build backend
        run: dotnet build src/Cove.slnx -c Release

      - name: Run backend tests
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Frontend type check + build
        working-directory: ui
        run: npm run build

      - name: Frontend tests
        working-directory: ui
        run: npm test
