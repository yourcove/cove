name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build frontend once, share via artifact ─────────────────────
  build-ui:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install & build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/
          retention-days: 1

  # ── Build self-contained executables per platform ───────────────
  build-native:
    needs: build-ui
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: cove-win-x64
            ext: .zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: cove-linux-x64
            ext: .tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact: cove-osx-arm64
            ext: .tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained app
        run: >
          dotnet publish src/Cove.Api/Cove.Api.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:PgvectorPayloadRepository=${{ github.repository }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ env.VERSION }}
          -p:CoveCiVersion=true
          -o publish/

      - name: Publish native instance manager
        run: >
          dotnet publish src/Cove.InstanceManager/Cove.InstanceManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ env.VERSION }}
          -p:CoveCiVersion=true
          -o publish/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $files = @("Cove.exe", "Cove.InstanceManager.exe")
          foreach ($file in $files) {
            $source = Join-Path "publish" $file
            if (-not (Test-Path $source)) { throw "Missing native executable: $source" }
            Copy-Item -Path $source -Destination $packageDir -Force
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath ${{ matrix.artifact }}${{ matrix.ext }}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("${{ matrix.artifact }}${{ matrix.ext }}")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName } | Sort-Object
          }
          finally {
            $zip.Dispose()
          }
          $expected = $files | Sort-Object
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $entries
          if ($diff) { throw "Unexpected archive contents: $($entries -join ', ')" }

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          for file in Cove Cove.InstanceManager; do
            test -f "publish/$file" || { echo "Missing native executable: publish/$file" >&2; exit 1; }
            cp "publish/$file" package/
          done
          tar -czf ${{ matrix.artifact }}${{ matrix.ext }} -C package Cove Cove.InstanceManager
          entries="$(tar -tzf ${{ matrix.artifact }}${{ matrix.ext }} | sort)"
          expected="$(printf 'Cove\nCove.InstanceManager')"
          if [ "$entries" != "$expected" ]; then
            echo "Unexpected archive contents:" >&2
            printf '%s\n' "$entries" >&2
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: sha256sum ${{ matrix.artifact }}${{ matrix.ext }} > ${{ matrix.artifact }}${{ matrix.ext }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256
          retention-days: 1

  # ── Determine release type ────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release is in the main history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" --no-tags
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD; then
            echo "Release tags must point to a commit in $DEFAULT_BRANCH." >&2
            exit 1
          fi

      - name: Check if stable release
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Stable = vN.N.N (no alpha/beta/rc/dev suffix)
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]] \
            && [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev(\.|$) ]]; then
            prerelease="${TAG#*-}"
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not contain leading zeroes: $TAG" >&2
                exit 1
              fi
            done
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "Release tags must be vMAJOR.MINOR.PATCH or a SemVer prerelease such as v1.2.0-rc.1." >&2
            echo "The -dev.N form is reserved for builds derived from main." >&2
            exit 1
          fi

  # ── Build Docker images (stable releases only) ───────────────────
  build-docker:
    needs: [build-ui, check-version]
    # Only publish Docker images for stable semver tags (v1.0.0, v2.1.3)
    # Skip for prerelease tags such as v1.0.0-alpha.1, v1.0.0-beta.2, or v1.0.0-rc.1
    if: needs.check-version.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            suffix: ''
            description: 'All-in-one (includes PostgreSQL + FFmpeg)'
          - dockerfile: docker/Dockerfile.app
            suffix: '-app'
            description: 'App only (requires external PostgreSQL)'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wwwroot
          path: src/Cove.Api/wwwroot/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            FFMPEG_MIRROR_BASE=https://github.com/${{ github.repository }}/releases/download/ffmpeg-payload

  # ── Create GitHub Release ───────────────────────────────────────
  release:
    needs: [build-native, check-version]
    # Always run after native builds succeed (Docker may have been skipped)
    if: always() && needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts/ -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' | while read f; do
            cp "$f" release-files/
          done

      - name: Extract release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo 'CHANGELOG<<EOF'
            awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate combined checksums
        working-directory: release-files
        run: |
          sha256sum *.zip *.tar.gz 2>/dev/null > checksums.txt || true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.check-version.outputs.is_stable != 'true' }}
          files: release-files/*
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Downloads

            Standalone executables for Windows, Linux, and macOS are attached below.

            ${{ needs.check-version.outputs.is_stable == 'true' && format('## Docker Images

            **All-in-one** (includes PostgreSQL + FFmpeg):
            ```
            docker pull {0}/{1}:{2}
            ```

            **App only** (requires external PostgreSQL):
            ```
            docker pull {0}/{1}-app:{2}
            ```

            See [Docker setup docs](docker/README.md) for docker-compose examples.', env.REGISTRY, env.IMAGE_NAME, steps.version.outputs.VERSION) || '> This is a pre-release. Docker images are only published for stable releases (e.g. v1.0.0).' }}

  # ── CI checks (runs on all pushes and PRs too) ──────────────────
  ci:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build backend
        run: dotnet build src/Cove.slnx -c Release

      - name: Run backend tests
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Frontend type check + build
        working-directory: ui
        run: npm run build

      - name: Frontend tests
        working-directory: ui
        run: npm test
