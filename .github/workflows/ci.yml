name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_coverage:
        description: Collect API coverage and enforce the controller coverage baseline
        required: false
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      backend: ${{ steps.classify.outputs.backend || steps.all.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend || steps.all.outputs.frontend }}
      cli: ${{ steps.classify.outputs.cli || steps.all.outputs.cli }}
    steps:
      - name: Run all checks outside pull requests
        id: all
        if: github.event_name != 'pull_request'
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "cli=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify pull request changes
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          backend=false
          frontend=false
          cli=false
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT

          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed_paths"

          while IFS= read -r -d '' path; do
            case "$path" in
              ui/src/test/fixtures/extension-guide-blocks.json|ui/src/components/featureGuideContent.ts)
                # Cove.Tests checks the host's feature-guide rules against the same fixture.
                backend=true
                frontend=true
                ;;
              ui/*)
                frontend=true
                ;;
              cli/*)
                cli=true
                ;;
              src/*|scripts/*|.config/*|Directory.Build.props|Directory.Build.targets|global.json|NuGet.config)
                backend=true
                ;;
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                cli=true
                ;;
              docs/feature-guides/*)
                frontend=true
                ;;
              docs/*|docs-site/*|.github/workflows/docs-site.yml|*.md)
                # Documentation does not affect app CI; docs-site has its own workflow.
                ;;
              coveicon.ico)
                backend=true
                ;;
              *)
                # New or shared paths run everything until classified more narrowly.
                backend=true
                frontend=true
                ;;
            esac
          done < "$changed_paths"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.slnx

      - name: Build
        run: dotnet build src/Cove.slnx -c Release --no-restore

      - name: Build Native Instance Manager
        run: dotnet build src/Cove.InstanceManager/Cove.InstanceManager.csproj -c Release

      - name: Test (Non-Integration)
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build --verbosity normal --output detailed --filter "FullyQualifiedName!~Cove.Tests.Integration"

      - name: Test (Integration smoke)
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build --verbosity normal --output detailed --filter "FullyQualifiedName~Cove.Tests.Integration"

  windows-file-read-races:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.Tests/Cove.Tests.csproj

      - name: Build
        run: dotnet build src/Cove.Tests/Cove.Tests.csproj --configuration Release --no-restore

      - name: Verify Windows filesystem semantics
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~Cove.Tests.FileReadRaceTests|FullyQualifiedName~Cove.Tests.FilesystemPathsTests|FullyQualifiedName~Cove.Tests.FileOpsControllerTests|FullyQualifiedName~Cove.Tests.GenerateJobServiceTests|FullyQualifiedName~Cove.Tests.ThumbnailServiceTests|FullyQualifiedName~Cove.Tests.StreamServiceTests|FullyQualifiedName~Cove.Tests.StreamControllerTests|FullyQualifiedName~Cove.Tests.DeletionSafetyTests" --output detailed

      - name: Stress concurrent blob reads and deletion
        shell: pwsh
        run: |
          1..12 | ForEach-Object {
            dotnet test src/Cove.Tests/Cove.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~Cove.Tests.BlobServiceTests.ConcurrentGetAndDelete_DoNotExposeLookupOpenRace" --output detailed
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  api-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVE_API_TEST_PG_HOST: 127.0.0.1
      COVE_API_TEST_PG_PORT: 5432
      COVE_API_TEST_PG_USER: postgres
      COVE_API_TEST_PG_PASSWORD: postgres
      COVE_API_TEST_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7

      # Backup and restore shell out to pg_dump/psql, and a plain dump from a newer client sets
      # parameters an older server rejects. Match the client to the pgvector:pg16 service above
      # instead of taking whatever major version the runner image ships.
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-16
          echo "PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/16/bin/pg_dump --version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore src/Cove.slnx

      - name: Restore tools
        if: ${{ inputs.api_coverage }}
        run: dotnet tool restore

      - name: Test controller coverage and release tooling
        run: >-
          node --test
          scripts/check-api-controller-coverage.test.mjs
          scripts/prepare-coverage-gutters.test.mjs
          scripts/generate-release-manifest.test.mjs

      - name: Test (Fluent API)
        if: ${{ !inputs.api_coverage }}
        # The pool defaults to half the logical processors, which is two on these 4-vCPU runners.
        # The suite is CPU-bound there: three servers measured fastest, and four were slower than two.
        env:
          COVE_API_TEST_WORKERS: 3
        run: >-
          dotnet test src/Cove.ApiTests/Cove.ApiTests.csproj
          -c Release --no-restore --verbosity normal --output detailed

      - name: Test (Fluent API with coverage)
        if: ${{ inputs.api_coverage }}
        run: >-
          dotnet tool run dotnet-coverage -- collect
          --settings src/Cove.ApiTests/coverage.config
          --output artifacts/coverage/api-tests.cobertura.xml
          --output-format cobertura
          dotnet test src/Cove.ApiTests/Cove.ApiTests.csproj
          -c Release --no-restore --verbosity normal --output detailed

      - name: Verify API controller coverage
        if: ${{ inputs.api_coverage }}
        run: node scripts/check-api-controller-coverage.mjs artifacts/coverage/api-tests.cobertura.xml

      - name: Upload backend coverage
        if: ${{ always() && inputs.api_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-backend-coverage
          path: artifacts/coverage/api-tests.cobertura.xml
          if-no-files-found: error

  performance:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVE_PERF_PG_HOST: 127.0.0.1
      COVE_PERF_PG_PORT: 5432
      COVE_PERF_PG_USER: postgres
      COVE_PERF_PG_PASSWORD: postgres
      COVE_PERF_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.PerformanceTests/Cove.PerformanceTests.csproj

      - name: Test
        run: dotnet test src/Cove.PerformanceTests/Cove.PerformanceTests.csproj -c Release --verbosity normal --output detailed

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Format check
        working-directory: ui
        run: npm run format:check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Type check & build
        working-directory: ui
        run: npm run build

      - name: Test
        working-directory: ui
        run: npx vitest run --passWithNoTests

  cli:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cli == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Type check and test
        working-directory: cli
        run: |
          bun run typecheck
          bun test

      - name: Build standalone executable
        working-directory: cli
        run: bun run build

      - name: Smoke test standalone executable
        working-directory: cli
        run: bun run test:compiled
