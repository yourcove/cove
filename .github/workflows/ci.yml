name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.slnx

      - name: Build
        run: dotnet build src/Cove.slnx -c Release --no-restore

      - name: Build Native Instance Manager
        run: dotnet build src/Cove.InstanceManager/Cove.InstanceManager.csproj -c Release

      - name: Test (Non-Integration)
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build --verbosity normal --filter "FullyQualifiedName!~Cove.Tests.Integration"

      - name: Test (Integration smoke)
        run: dotnet test src/Cove.Tests/Cove.Tests.csproj -c Release --no-build --verbosity normal --filter "FullyQualifiedName~Cove.Tests.Integration"

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVE_API_TEST_PG_HOST: 127.0.0.1
      COVE_API_TEST_PG_PORT: 5432
      COVE_API_TEST_PG_USER: postgres
      COVE_API_TEST_PG_PASSWORD: postgres
      COVE_API_TEST_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Test (Fluent API)
        run: >-
          dotnet tool run dotnet-coverage -- collect
          --settings src/Cove.ApiTests/coverage.config
          --output artifacts/coverage/api-tests.cobertura.xml
          --output-format cobertura
          dotnet test src/Cove.ApiTests/Cove.ApiTests.csproj
          -c Release --no-restore --verbosity normal

      - name: Verify backend coverage
        run: >-
          grep --extended-regexp --quiet
          '<class line-rate="(1|0\.[0-9]*[1-9][0-9]*)"[^>]* name="Cove\.Api\.Controllers\.'
          artifacts/coverage/api-tests.cobertura.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-backend-coverage
          path: artifacts/coverage/api-tests.cobertura.xml
          if-no-files-found: error

  performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVE_PERF_PG_HOST: 127.0.0.1
      COVE_PERF_PG_PORT: 5432
      COVE_PERF_PG_USER: postgres
      COVE_PERF_PG_PASSWORD: postgres
      COVE_PERF_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Cove.PerformanceTests/Cove.PerformanceTests.csproj

      - name: Test
        run: dotnet test src/Cove.PerformanceTests/Cove.PerformanceTests.csproj -c Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Type check & build
        working-directory: ui
        run: npm run build

      - name: Test
        working-directory: ui
        run: npx vitest run --passWithNoTests
