# Cove – App + PostgreSQL (recommended for most users)
#
# Data is stored in a single configurable directory on the host
# (defaults to ./cove-data/ relative to this file). Override with:
#   COVE_DATA_DIR=/path/to/data docker compose up -d
#
# Only the cache uses a named volume (it is safe to lose;
# it will be recreated automatically). All persistent data
# uses bind mounts and survives docker compose down -v.
#
# Usage:
#   docker compose up -d
#
# GPU acceleration (optional):
#   For NVIDIA GPUs, uncomment the deploy section below and ensure
#   nvidia-container-toolkit is installed on the host.
#
#   For Intel/AMD VAAPI, uncomment the devices section below.

services:
  cove:
    image: ghcr.io/yourcove/cove-app:latest
    restart: unless-stopped
    ports:
      - "5073:5073"
    depends_on:
      db:
        condition: service_healthy
    environment:
      COVE__Postgres__Managed: "false"
      COVE__Postgres__ConnectionString: "Host=db;Port=5432;Database=cove;Username=cove;Password=cove"
      # Persist cove's config (cove-config.json) + installed extensions on /config, and backups on
      # /backups, so important data lives on bind mounts and survives `docker compose down -v`.
      COVE_HOME: /config
      COVE__GeneratedPath: /generated
      COVE__CachePath: /cache
      COVE__BackupPath: /backups
    volumes:
      # Reserved for managed-Postgres data (COVE__Postgres__DataPath); unused with external Postgres.
      - ${COVE_DATA_DIR:-./cove-data}/data:/data
      - ${COVE_DATA_DIR:-./cove-data}/config:/config
      - ${COVE_DATA_DIR:-./cove-data}/generated:/generated
      - ${COVE_DATA_DIR:-./cove-data}/backups:/backups
      - cove-cache:/cache
      # Mount your media library (adjust path):
      # - /path/to/your/media:/media:ro
      # Example network share mount using the commented volume below:
      # - yourcontent:/media:ro

    # ── GPU acceleration (uncomment ONE section) ──────────────────
    # NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    #
    # Intel/AMD VAAPI:
    # devices:
    #   - /dev/dri:/dev/dri

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
    volumes:
      - ${COVE_DATA_DIR:-./cove-data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cove-cache:
